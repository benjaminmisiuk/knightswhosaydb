[project]
name = "knightswhosaydb"
version = "0.1.0"
description = "Multibeam backscatter reading and processing"
authors = [{name = "Benjamin Misiuk", email = "bmisiuk@mun.ca"},
           {name = "Peter Urban", email = "peter.urban@urcoustics.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">= 3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [

]

[project.optional-dependencies]
grid = ["rasterio"]
kmall = ["themachinethatgoesping"]
all = ["themachinethatgoesping", "rasterio"]

[project.urls]
Homepage = "https://github.com/benjaminmisiuk/knights-who-say-db"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/knightswhosaydb"]

# ---------------------------------------------------------------------------
# pixi
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
knightswhosaydb = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.12"
hatchling = "*"
pip = ">=26.0.1,<27"
pytest = ">=9.0.3,<10"
nbmake = ">=1.5.5,<2"

# [tool.pixi.tasks]
# test = "pytest tests/"

[tool.pixi.feature.build.dependencies]
python-build = "*"
twine = "*"
anaconda-client = "*"
rattler-build = "*"

[tool.pixi.feature.build.tasks]
build-pypi = "python -m build"
upload-pypi = { cmd = "twine upload dist/*", depends-on = ["build-pypi"] }
build-conda = "rattler-build build --recipe recipe/recipe.yaml --output output"
#test_notebooks = "python test_notebooks.py"
clean_notebooks = "python misc/clean_notebooks.py"

[tool.pixi.environments]
default = { solve-group = "default" }
build = { features = ["build"], solve-group = "default" }

# [tool.pytest.ini_options]
# testpaths = ["tests"]
